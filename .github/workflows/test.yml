name: test
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python test/test_skill.py

  catalog:
    # Monthly only: a vendor repo going dead is the one failure the offline test cannot see.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/verify_catalog.py
